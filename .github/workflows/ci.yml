name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix /tmp/health-monitor-sql-check --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.5.8
      - name: Verify migrations in isolated PostgreSQL
        run: PGLITE_MODULE=/tmp/health-monitor-sql-check/node_modules/@electric-sql/pglite node tests/sql/verify-migrations.cjs
      - run: npm run lint
      - run: npm run build
